name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend-tests:
    name: Backend quant tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 퀀트 코어는 numpy/pandas/scipy 만으로 동작. ML 스위트용 라이브러리는 선택 설치.
          pip install numpy pandas scipy pytest
          pip install scikit-learn xgboost lightgbm || echo "optional ML libs skipped"

      - name: Run quant correctness test suite
        run: |
          pytest backend/tests -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and build
        working-directory: frontend
        run: |
          npm install
          npm run build
